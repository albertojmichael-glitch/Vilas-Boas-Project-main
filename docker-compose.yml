services:
  web:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - SAVE_ENCRYPTION_KEY=${SAVE_ENCRYPTION_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - DATABASE_URL=${DATABASE_URL:-postgresql://vilasboas:vilasboas@postgres:5432/vilasboas}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-Lax}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vilasboas}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vilasboas}
      - POSTGRES_DB=${POSTGRES_DB:-vilasboas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vilasboas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: always

volumes:
  postgres_data:
