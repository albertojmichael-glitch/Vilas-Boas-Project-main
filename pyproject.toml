[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vilas-boas-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0,<4.0.0",
    "Flask-CORS>=6.0.0,<7.0.0",
    "Flask-Limiter>=3.5.0,<4.0.0",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Migrate>=4.0.5",
    "Authlib>=1.3.0",
    "certifi>=2024.7.4",
    "pydantic>=2.5.3,<3.0.0",
    "cachetools>=5.3.2,<6.0.0",
    "gunicorn>=22.0.0,<23.0.0",
    "rcssmin==1.1.2",
    "rjsmin==1.2.2",
    "colorama>=0.4.6",
    "redis>=5.0.1,<6.0.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "fakeredis>=2.21.0",
    "ruff>=0.11.0",
    "mypy>=1.9.0",
    "pip-audit>=2.7.0",
    "types-requests",
    "types-cachetools",
    "types-redis",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "fakeredis>=2.21.0",
    "ruff>=0.11.0",
    "mypy>=1.9.0",
    "pip-audit>=2.7.0",
    "types-requests",
    "types-cachetools",
    "types-redis",
]

[tool.setuptools.packages.find]
where = ["server"]
include = ["villas_boas*", "routes*", "services*", "data*"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
mypy_path = "server"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
