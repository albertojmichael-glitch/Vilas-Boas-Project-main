name: Build offline

on:
  pull_request:
    paths:
      - 'offline/**'
      - 'client/assets/**'
      - 'server/data/**'
      - '.github/workflows/build_offline.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            binary: vilas_boas.exe
          - platform: linux-x64
            runner: ubuntu-latest
            binary: vilas_boas

    defaults:
      run:
        working-directory: offline

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências de compilação no Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'offline -> target'

      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo build --release --locked

      - name: Disponibilizar executável
        uses: actions/upload-artifact@v4
        with:
          name: Vilas-Boas-Offline-${{ matrix.platform }}
          path: offline/target/release/${{ matrix.binary }}
          if-no-files-found: error
