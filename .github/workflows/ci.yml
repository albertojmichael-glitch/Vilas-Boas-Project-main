name: CI do Vilas Boas OS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    steps:
    - name: Fazer checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verificar lint e formatação com Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Verificação estática de tipos com Mypy
      run: |
        MYPYPATH=server mypy --explicit-package-bases server/

    - name: Executar testes automatizados com Pytest e Cobertura
      run: |
        PYTHONPATH=server pytest tests/ --cov=server --cov-report=term-missing

    - name: Atualizar setuptools
      run: |
        python -m pip install --upgrade "setuptools>=84.1.0"

    - name: Auditoria de Segurança (Dependências)
      run: |
        pip-audit --desc on

  balance:
    name: Balanceamento (lote pesado de simulações)
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
    - name: Fazer checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Simular 20 mil partidas por dificuldade
      run: |
        PYTHONPATH=server pytest -m slow tests/test_balanceamento.py -v

    - name: Relatório de balanceamento
      run: |
        PYTHONPATH=server python -m villas_boas.simulacao --partidas 5000 \
          --dificuldade NORMAL PESADELO --estrategia competente aleatoria

  navegador:
    name: Frontend e fluxos E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -e .
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - name: Publicar relatório e traces de falha
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  offline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build_offline.yml

  publicar:
    name: Publicar API e cliente na Vercel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, balance, navegador, offline]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publicar o commit aprovado se ainda estiver na ponta da main
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_BACKEND_PROJECT: ${{ vars.VERCEL_BACKEND_PROJECT }}
          VERCEL_FRONTEND_PROJECT: ${{ vars.VERCEL_FRONTEND_PROJECT }}
        run: |
          ponta=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ "${ponta%%[[:space:]]*}" == "$GITHUB_SHA" ]]; then
            node scripts/deploy-vercel.mjs
          fi
