name: CI do Vilas Boas OS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    steps:
    - name: Fazer checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' 

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest mypy pip-audit
        cd server
        pip install -r requirements.txt

    - name: Verificar lint e formatação com Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Verificação estática de tipos com Mypy
      run: |
        cd server && mypy app.py state.py --ignore-missing-imports || true

    - name: Executar testes automatizados com Pytest
      run: |
        PYTHONPATH=server pytest tests/

    - name: Auditoria de Segurança (Dependências)
      run: |
        pip-audit --desc on


  frontend-build:
    name: Frontend TypeScript Build
    runs-on: ubuntu-latest

    steps:
    - name: Fazer checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Instalar TypeScript
      run: npm install -g typescript

    - name: Compilar Cliente (TypeScript)
      run: tsc -p client/tsconfig.json