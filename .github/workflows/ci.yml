name: CI do Vilas Boas OS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    steps:
    - name: Fazer checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verificar lint e formatação com Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Verificação estática de tipos com Mypy
      run: |
        MYPYPATH=server mypy --explicit-package-bases server/

    - name: Executar testes automatizados com Pytest e Cobertura
      run: |
        PYTHONPATH=server pytest tests/ --cov=server --cov-report=term-missing

    - name: Atualizar setuptools
      run: |
        python -m pip install --upgrade "setuptools>=84.1.0"

    - name: Auditoria de Segurança (Dependências)
      run: |
        pip-audit --desc on

  balance:
    name: Balanceamento (lote pesado de simulações)
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
    - name: Fazer checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Simular 20 mil partidas por dificuldade
      run: |
        PYTHONPATH=server pytest -m slow tests/test_balanceamento.py -v

    - name: Relatório de balanceamento
      run: |
        PYTHONPATH=server python -m villas_boas.simulacao --partidas 5000 \
          --dificuldade NORMAL PESADELO --estrategia competente aleatoria

  frontend-build:
    name: Frontend TypeScript Build
    runs-on: ubuntu-latest

    steps:
    - name: Fazer checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Instalar TypeScript
      run: npm install -g typescript

    - name: Compilar Cliente (TypeScript)
      run: tsc -p client/tsconfig.json

  e2e:
    name: Acessibilidade e mobile (Playwright)
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
    - name: Fazer checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar dependências Python
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'

    - name: Instalar dependências do front e o Chromium
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Testes WCAG (axe), teclado e celular
      env:
        PYTHON: python
      run: npx playwright test

    - name: Guardar relatório em caso de falha
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: relatorio-playwright
        path: playwright-report/
        retention-days: 7

  deploy:
    name: Deploy de produção (só com todos os testes verdes)
    runs-on: ubuntu-latest
    # Só depois de lint, testes, balanceamento, build do front e E2E passarem,
    # e só em push na main (nunca em pull request).
    needs: [backend-tests, balance, frontend-build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-producao
      cancel-in-progress: false

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_FRONT: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_ID_API: ${{ secrets.VERCEL_PROJECT_ID_API }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}

    steps:
    - name: Fazer checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Conferir os secrets de deploy
      run: |
        faltando=""
        for nome in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID_FRONT; do
          [ -n "${!nome}" ] || faltando="$faltando $nome"
        done
        if [ -n "$faltando" ]; then
          echo "::error::Secrets de deploy ausentes:$faltando (veja a seção Deploy do README)."
          exit 1
        fi

    - name: Instalar a CLI da Vercel
      run: npm install --global vercel@latest

    - name: Deploy da API (Vercel)
      if: env.VERCEL_PROJECT_ID_API != ''
      env:
        VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID_API }}
      run: |
        vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        vercel deploy --prod --token="$VERCEL_TOKEN"
        rm -rf .vercel

    - name: Deploy do front (Vercel)
      env:
        VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID_FRONT }}
      run: |
        vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        vercel deploy --prod --token="$VERCEL_TOKEN"

    - name: Deploy da API (Railway, opcional)
      if: env.RAILWAY_TOKEN != '' && env.RAILWAY_SERVICE != ''
      run: |
        npm install --global @railway/cli
        railway up --service "$RAILWAY_SERVICE" --detach
