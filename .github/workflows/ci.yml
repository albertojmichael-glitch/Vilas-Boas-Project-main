name: CI do Vilas Boas OS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  backend-tests:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    steps:
    - name: Fazer checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verificar lint e formatação com Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Verificação estática de tipos com Mypy
      run: |
        MYPYPATH=server mypy --explicit-package-bases server/

    - name: Executar testes automatizados com Pytest e Cobertura
      run: |
        PYTHONPATH=server pytest tests/ --cov=server --cov-report=term-missing

    - name: Atualizar setuptools
      run: |
        python -m pip install --upgrade "setuptools>=84.1.0"

    - name: Auditoria de Segurança (Dependências)
      run: |
        pip-audit --desc on

  balance:
    name: Balanceamento (lote pesado de simulações)
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
    - name: Fazer checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Simular 20 mil partidas por dificuldade
      run: |
        PYTHONPATH=server pytest -m slow tests/test_balanceamento.py -v

    - name: Relatório de balanceamento
      run: |
        PYTHONPATH=server python -m villas_boas.simulacao --partidas 5000 \
          --dificuldade NORMAL PESADELO --estrategia competente aleatoria

  navegador:
    name: Frontend e fluxos E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -e .
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - name: Publicar relatório e traces de falha
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
