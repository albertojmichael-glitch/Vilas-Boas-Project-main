[package]
name = "vilas_boas"
version = "20.8.0"
edition = "2021"
description = "Vilas Boas - Terminal v20.08 Offline"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", features = ["jpeg", "png", "webp", "bmp", "gif"] }
rand = "0.8"
rodio = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
